<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC — Simplify • Master • Continue | UI, UX &amp; Design Thinking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg: #f6f4fb;
  --bg-panel: #ffffff;
  --ink: #241b3a;
  --ink-soft: #6a5f85;
  --line: #e2dbf2;
  --rail: #6d28d9;      /* design-tool violet - the "thread" */
  --rail-bright: #a78bfa;
  --spark: #f59e0b;     /* amber - travels the thread, CTAs */
  --spark-dark: #c9790a;
  --volt: #fcd34d;      /* warm amber - highlights / remember boxes */
  --wrong: #e0503a;
  --right: #1f9d63;
  --station-shadow: 0 6px 0 rgba(109,40,217,0.18);
  --radius: 18px;
  --font-display: 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
[data-theme="dark"]{
  --bg: #17111f;
  --bg-panel: #221a30;
  --ink: #f1ecfb;
  --ink-soft: #b5a8d6;
  --line: #382a4d;
  --rail: #a78bfa;
  --rail-bright: #c9b6fc;
  --spark: #fbbf5c;
  --spark-dark: #f59e0b;
  --volt: #fcd34d;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:19px;
  line-height:1.6;
  transition:background .3s ease, color .3s ease;
}
h1,h2,h3,h4,.display{font-family:var(--font-display); color:var(--ink); margin:0 0 .4em 0;}
h1{font-weight:800;} h2{font-weight:700;} h3{font-weight:700;}
p{margin:0 0 .8em 0;}
a{color:var(--rail);}
button{font-family:var(--font-body); cursor:pointer;}
:focus-visible{outline:3px solid var(--spark); outline-offset:2px;}
img,svg{max-width:100%;}
code{font-family:var(--font-mono);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}

/* ============ LAYOUT SHELL ============ */
.app{display:flex; min-height:100vh;}

.railnav{
  width:290px; flex-shrink:0;
  background:var(--bg-panel);
  border-right:2px solid var(--line);
  padding:22px 16px 30px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 6px 18px; border-bottom:2px dashed var(--line); margin-bottom:14px;}
.brand-badge{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--rail),var(--rail-bright));
  display:flex;align-items:center;justify-content:center;
  font-size:22px; flex-shrink:0;
  box-shadow:var(--station-shadow);
}
.brand-text .t1{font-family:var(--font-display); font-weight:800; font-size:20px; line-height:1;}
.brand-text .t2{font-size:12.5px; color:var(--ink-soft); line-height:1.3;}
.unit-sub{font-size:12.5px; font-weight:700; color:var(--rail); text-transform:uppercase; letter-spacing:.04em; margin:0 6px 12px;}

.stationlist{list-style:none; margin:0; padding:0; position:relative;}
.groupheader{
  font-size:11.5px; font-weight:800; letter-spacing:.05em; color:var(--ink-soft);
  text-transform:uppercase; margin:16px 0 6px 6px; padding-top:8px;
}
.groupheader:first-child{margin-top:0;}
.stationlist::before{
  content:"";
  position:absolute; left:19px; top:6px; bottom:6px; width:4px;
  background:repeating-linear-gradient(180deg, var(--rail) 0 8px, transparent 8px 14px);
  border-radius:4px; opacity:.5;
}
.stationlist li{position:relative; margin:2px 0;}
.navbtn{
  width:100%; text-align:left; background:none; border:none;
  display:flex; align-items:center; gap:12px;
  padding:9px 10px 9px 6px; border-radius:12px; color:var(--ink);
  font-size:15px; font-weight:600;
}
.navbtn:hover{background:var(--bg);}
.navbtn.active{background:var(--rail); color:#fff;}
.navdot{
  width:28px;height:28px;border-radius:50%; flex-shrink:0; position:relative; z-index:1;
  background:var(--bg-panel); border:3px solid var(--rail);
  display:flex; align-items:center; justify-content:center; font-size:13px;
}
.navbtn.active .navdot{background:var(--volt); border-color:var(--volt); color:#3a2a00;}
.navbtn.done .navdot{background:var(--rail); border-color:var(--rail); color:#fff;}
.navlabel{flex:1;}

.railnav-foot{margin-top:16px; padding-top:14px; border-top:2px dashed var(--line);}
.toolbtn{
  width:100%; display:flex; align-items:center; gap:10px; justify-content:center;
  padding:10px; border-radius:12px; border:2px solid var(--line); background:var(--bg-panel);
  color:var(--ink); font-weight:700; font-size:14px; margin-bottom:8px;
}
.toolbtn:hover{border-color:var(--rail);}
.menubtn{display:none;}

.main{flex:1; min-width:0;}
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg-panel); border-bottom:2px solid var(--line);
  padding:12px 26px;
}
.progresswrap{display:flex; align-items:center; gap:14px;}
.progressbar{flex:1; height:14px; border-radius:8px; background:var(--line); overflow:hidden; position:relative;}
.progressfill{
  height:100%; border-radius:8px;
  background:linear-gradient(90deg,var(--rail),var(--rail-bright));
  width:6%; transition:width .5s ease;
  position:relative;
}
.progressfill::after{
  content:"✨"; position:absolute; right:-4px; top:50%; transform:translateY(-50%);
  font-size:16px; filter:drop-shadow(0 0 3px var(--spark));
}
.progresslabel{font-size:13px; font-weight:700; color:var(--ink-soft); white-space:nowrap;}

.content{padding:34px 40px 90px; max-width:940px; margin:0 auto;}
section.station{display:none; animation:fadein .35s ease;}
section.station.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--rail); color:#fff; font-weight:700; font-size:13px;
  padding:5px 14px; border-radius:999px; margin-bottom:14px;
}
.stationtitle{font-size:clamp(26px,4vw,38px); margin-bottom:6px;}
.stationsub{color:var(--ink-soft); font-size:17px; margin-bottom:26px; max-width:70ch;}

/* ============ CONTENT COMPONENTS ============ */
.card{
  background:var(--bg-panel); border:2px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; margin-bottom:20px;
}
.explain-card{border-left:8px solid var(--rail);}
.explain-card h3{display:flex; align-items:center; gap:8px; font-size:18px;}

.analogy-card{
  background:linear-gradient(135deg, rgba(109,40,217,.07), rgba(245,158,11,.07));
  border:2px dashed var(--rail);
}
.analogy-card h3{color:var(--rail);}

.remember-box{
  background:#fff8e2; border:2px solid var(--volt); border-radius:var(--radius);
  padding:18px 22px; margin:20px 0;
}
[data-theme="dark"] .remember-box{background:#2c2308;}
.remember-box h3{color:#8a6a00; display:flex; gap:8px; align-items:center;}
[data-theme="dark"] .remember-box h3{color:var(--volt);}
.remember-box ul{margin:0; padding-left:22px;}
.remember-box li{margin-bottom:4px;}

.mistake-box{
  background:#fdeceb; border:2px solid var(--wrong); border-radius:var(--radius);
  padding:18px 22px; margin:20px 0;
}
[data-theme="dark"] .mistake-box{background:#2b1310;}
.mistake-box h3{color:var(--wrong); display:flex; gap:8px; align-items:center;}

details.more{
  border:2px solid var(--line); border-radius:var(--radius); margin:16px 0; overflow:hidden;
}
details.more summary{
  cursor:pointer; padding:14px 20px; font-weight:700; list-style:none;
  display:flex; align-items:center; gap:10px; background:var(--bg);
}
details.more summary::-webkit-details-marker{display:none;}
details.more summary::before{content:"➕"; font-size:14px;}
details.more[open] summary::before{content:"➖";}
details.more .more-inner{padding:16px 20px;}

/* Diagram row of clickable components */
.diagram{
  display:flex; flex-wrap:wrap; gap:14px; justify-content:center;
  padding:26px 10px; margin:18px 0;
}
.node{
  background:var(--bg-panel); border:3px solid var(--rail); border-radius:16px;
  padding:16px 18px; min-width:110px; text-align:center; font-weight:700;
  box-shadow:var(--station-shadow);
}
.node.clickable{cursor:pointer;}
.node.clickable:hover, .node.revealed{background:var(--rail); color:#fff; transform:translateY(-3px);}
.node .emoji{font-size:28px; display:block; margin-bottom:6px;}
.node-pop{
  display:none; margin-top:8px; font-size:14px; font-weight:400; text-align:left;
  background:var(--bg); border-radius:10px; padding:10px 12px; color:var(--ink);
}
.node.revealed .node-pop{display:block;}

/* Tabs */
.tabbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.tabbtn{
  padding:9px 16px; border-radius:999px; border:2px solid var(--line); background:var(--bg-panel);
  font-weight:700; font-size:14.5px; color:var(--ink);
}
.tabbtn.active{background:var(--spark); border-color:var(--spark); color:#fff;}
.tabpanel{display:none;}
.tabpanel.active{display:block; animation:fadein .3s ease;}

/* comparison grid */
.flow-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:18px 0;}
.flow-card{border:2px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--bg-panel);}

/* device chips */
.chiprow{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0;}
.chip{
  background:var(--bg); border:2px solid var(--line); border-radius:999px; padding:8px 16px; font-size:14.5px; font-weight:600;
}

/* ---- Live demo cards (code + rendered output) ---- */
.democard{
  border:2px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:18px 0;
  background:var(--bg-panel);
}
.demo-label{
  padding:10px 16px; font-weight:800; font-size:13.5px; letter-spacing:.02em;
  background:var(--bg); border-bottom:2px solid var(--line); color:var(--ink-soft);
  text-transform:uppercase;
}
.demo-tabs{display:flex; gap:0; border-bottom:2px solid var(--line); background:var(--bg);}
.demotab{
  flex:1; padding:11px 14px; border:none; background:none; font-weight:700; font-size:14.5px;
  color:var(--ink-soft); border-bottom:3px solid transparent;
}
.demotab.active{color:var(--rail); border-bottom-color:var(--rail); background:var(--bg-panel);}
.demo-pane{display:none;}
.demo-pane.active{display:block;}
.demo-frame{width:100%; border:none; display:block; background:#fff;}
.code-block{
  margin:0; padding:16px 18px; background:#1e1730; color:#e8dfff; overflow-x:auto;
  font-family:var(--font-mono); font-size:13.5px; line-height:1.55; max-height:420px; overflow-y:auto;
}
[data-theme="dark"] .code-block{background:#0f0a1a;}
.code-block code{white-space:pre;}

/* MCQ */
.quiz-card{background:var(--bg-panel); border:2px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:18px;}
.quiz-q{font-weight:700; margin-bottom:12px; font-size:17.5px;}
.quiz-opts{display:flex; flex-direction:column; gap:9px;}
.opt{
  text-align:left; padding:11px 16px; border-radius:12px; border:2px solid var(--line);
  background:var(--bg); font-size:15.5px; font-weight:600; color:var(--ink);
}
.opt:hover{border-color:var(--rail);}
.opt.correct{background:#e5f7ec; border-color:var(--right); color:#0d5c34;}
.opt.incorrect{background:#fdeceb; border-color:var(--wrong); color:#8a2a1c;}
[data-theme="dark"] .opt.correct{background:#0e2a1c;}
[data-theme="dark"] .opt.incorrect{background:#2b1310;}
.quiz-feedback{margin-top:10px; font-weight:700; display:none;}
.quiz-feedback.show{display:block; animation:fadein .3s ease;}
.scorebar{
  background:var(--bg); border:2px solid var(--line); border-top:none;
  padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px;
  border-radius:0 0 var(--radius) var(--radius); margin-top:-20px; margin-bottom:20px;
}

/* buttons */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--spark); color:#fff; border:none; font-weight:700; font-size:15.5px;
  padding:12px 22px; border-radius:14px; box-shadow:0 4px 0 var(--spark-dark);
}
.btn:active{transform:translateY(3px); box-shadow:none;}
.btn.secondary{background:var(--bg-panel); color:var(--rail); border:2px solid var(--rail); box-shadow:none;}
.navfoot{display:flex; justify-content:space-between; gap:12px; margin-top:34px; padding-top:22px; border-top:2px dashed var(--line);}

/* home hero */
.hero{
  background:linear-gradient(135deg, var(--rail), var(--rail-bright));
  color:#fff; border-radius:24px; padding:40px 34px; margin-bottom:26px; position:relative; overflow:hidden;
}
.hero h1{color:#fff; font-size:clamp(26px,4.5vw,40px);}
.hero p{color:rgba(255,255,255,.92); font-size:18px; max-width:60ch;}
.hero-deco{position:absolute; right:-10px; bottom:-10px; opacity:.22; font-size:120px; line-height:1;}
.stat-row{display:flex; flex-wrap:wrap; gap:14px; margin-top:22px;}
.stat-pill{background:rgba(255,255,255,.18); padding:10px 18px; border-radius:14px; font-weight:700; font-size:14.5px;}

.route-preview{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:10px;}
.route-item{
  background:var(--bg-panel); border:2px solid var(--line); border-radius:14px; padding:14px; text-align:center; font-weight:700; font-size:14px;
}
.route-item .emoji{font-size:26px; display:block; margin-bottom:6px;}

.pagefoot{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:20px; max-width:940px; margin:0 auto;}

[data-spacing="wide"] body, [data-spacing="wide"]{letter-spacing:.02em; word-spacing:.12em; line-height:1.85;}

@media (max-width: 880px){
  .railnav{
    position:fixed; left:0; top:0; height:100vh; z-index:40; transform:translateX(-105%);
    transition:transform .25s ease; width:78vw; max-width:320px; box-shadow:8px 0 24px rgba(0,0,0,.15);
  }
  .railnav.open{transform:translateX(0);}
  .menubtn{
    display:flex; align-items:center; gap:8px; background:var(--rail); color:#fff; border:none;
    padding:9px 14px; border-radius:12px; font-weight:700; font-size:14px;
  }
  .content{padding:22px 16px 90px;}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}
  .scrim.show{display:block;}
}
</style>
</head>
<body>

<div class="app">
  <nav class="railnav" id="railnav" aria-label="Portal navigation">
    <div class="brand">
      <div class="brand-badge">🎨</div>
      <div class="brand-text">
        <div class="t1">SMC</div>
        <div class="t2">Simplify • Master • Continue</div>
      </div>
    </div>
    <ul class="stationlist" id="stationlist"></ul>
    <div class="railnav-foot">
      <button class="toolbtn" id="darkToggle" type="button">🌙 <span>Dark mode</span></button>
      <button class="toolbtn" id="spacingToggle" type="button">🔤 <span>Easy-read spacing</span></button>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="menubtn" id="menubtn" type="button">☰ <span>Menu</span></button>
        <div class="progresswrap">
          <div class="progressbar"><div class="progressfill" id="progressfill"></div></div>
          <div class="progresslabel" id="progresslabel">Station 1</div>
        </div>
      </div>
    </div>

    <div class="content" id="content"></div>

    <p class="pagefoot">Built for 23CS/PE/XI15 · UI, UX and Design Thinking · Stella Maris College (Autonomous), Chennai.</p>
  </div>
</div>

<script src="uiux-app.js"></script>
</body>
</html>
